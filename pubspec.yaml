name: ai_medimate
description: AI-powered Medication Management App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1


dependencies:
  flutter:
    sdk: flutter



  # Firebase (latest compatible set as of Sept 2025)
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.2
  firebase_messaging: ^16.0.2
  firebase_storage: ^13.0.2

  # UI & Navigation
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  lottie: ^3.3.2


  # State Management
  provider: ^6.1.1

  # Local Storage & Database
  sqflite: ^2.3.0
  shared_preferences: ^2.2.2

  #  # Notifications
  #  flutter_local_notifications: 15.1.2

  # Image Processing & OCR
  image_picker: ^1.0.4
  camera: ^0.11.0+1
  tesseract_ocr: ^0.5.0
  file_picker: ^10.3.3
  # ML Kit
  google_mlkit_text_recognition: ^0.15.0
  google_mlkit_commons: ^0.11.0
  #  opencv_4: ^1.0.0

  # ML & AI
  tflite_flutter: ^0.11.0
  http: ^1.1.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.2.1
  permission_handler: ^12.0.1
  path_provider: ^2.1.1


dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
    - assets/Profile_avatar_placeholder.png
#    - assets/avatar_placeholder.png
